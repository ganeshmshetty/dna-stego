[project]
name = "tracedna"
version = "0.1.0"
description = "DNA storage with keyed provenance marks"
requires-python = ">=3.12,<3.14"
dependencies = [
    "reedsolo>=1.7",
    "numpy>=2.0",
    "scipy>=1.14",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracedna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
